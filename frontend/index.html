<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления | Secure App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <div class="card" id="loginBox">
            <div class="icon-header">🔒</div>
            <h2>Вход в систему</h2>
            <p class="subtitle">Введите данные для доступа</p>
            
            <div class="input-group">
                <label for="username">Логин</label>
                <input type="text" id="username" placeholder="admin" value="admin" autocomplete="username">
            </div>
            
            <div class="input-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="••••••••" value="password123" autocomplete="current-password">
            </div>
            
            <button id="loginBtn" class="btn-primary">Войти</button>
            <p id="loginStatus" class="status-msg"></p>
        </div>

        <!-- ЭКРАН ДАННЫХ (СКРЫТ) -->
        <div class="card hidden" id="dataBox">
            <div class="user-profile">
                <div class="avatar">A</div>
                <div>
                    <h2 style="margin:0; text-align:left;">Администратор</h2>
                    <p class="subtitle" style="margin:0;">Вы успешно авторизованы</p>
                </div>
                <button id="logoutBtn" class="btn-icon" title="Выйти">✖</button>
            </div>

            <div class="data-section">
                <button id="loadBtn" class="btn-secondary">Загрузить защищенные данные</button>
                
                <div id="result" class="result-box">
                    Нажмите кнопку выше, чтобы получить данные с сервера.
                </div>
            </div>
        </div>
    </div>

    <script src="site.js"></script>
</body>
</html>
